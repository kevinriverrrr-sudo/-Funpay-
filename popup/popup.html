<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FunPay Customizer - Dashboard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="dashboard-container">
    <header class="dashboard-header">
      <div class="header-content">
        <h1>🎨 FunPay Customizer</h1>
        <p class="header-subtitle">Панель быстрого доступа</p>
      </div>
    </header>

    <div id="loading-state" class="loading-state hidden">
      <div class="spinner"></div>
      <p>Загрузка...</p>
    </div>

    <div id="error-state" class="error-state hidden">
      <p>⚠️ Ошибка загрузки настроек</p>
    </div>

    <main class="dashboard-content" id="dashboard-content">
      <section class="dashboard-section">
        <h2 class="section-title">Быстрые переключатели</h2>
        <div class="quick-toggles" id="quick-toggles"></div>
      </section>

      <section class="dashboard-section">
        <h2 class="section-title">Тема</h2>
        <div class="theme-selector">
          <select id="quick-theme" class="dashboard-select">
            <option value="default">По умолчанию</option>
            <option value="dark">Тёмная</option>
            <option value="light">Светлая</option>
            <option value="blue">Синяя</option>
            <option value="purple">Фиолетовая</option>
          </select>
        </div>
      </section>

      <section class="dashboard-section">
        <h2 class="section-title">Действия</h2>
        <div class="action-buttons">
          <button id="apply-btn" class="dashboard-btn primary">
            <span class="btn-icon">✓</span>
            <span>Применить</span>
          </button>
          <button id="advanced-btn" class="dashboard-btn secondary">
            <span class="btn-icon">⚙</span>
            <span>Настройки</span>
          </button>
        </div>
      </section>

      <section class="dashboard-section stats-section">
        <h2 class="section-title">Статистика</h2>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon">📊</div>
            <div class="stat-value" id="active-features">0</div>
            <div class="stat-label">Активных функций</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">🎨</div>
            <div class="stat-value" id="current-theme">Default</div>
            <div class="stat-label">Текущая тема</div>
          </div>
        </div>
      </section>
    </main>

    <footer class="dashboard-footer">
      <p>Создано @MarkusGarantor</p>
    </footer>
  </div>

  <script src="../shared/storage.js"></script>
  <script src="../shared/ui-components.js"></script>
  <script src="popup.js"></script>
</body>
</html>
