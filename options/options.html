<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FunPay Customizer - Центр управления</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-content">
        <h1>🎨 FunPay Customizer</h1>
        <p class="subtitle">Центр управления расширением</p>
        <p class="author-credit">Создано @MarkusGarantor</p>
      </div>
    </header>

    <div class="app-layout">
      <aside class="sidebar">
        <nav class="sidebar-nav" role="tablist" aria-label="Настройки">
          <button class="nav-item active" role="tab" data-section="customization" aria-selected="true" tabindex="0">
            <span class="nav-icon">🎨</span>
            <span class="nav-label">Кастомизация</span>
          </button>
          <button class="nav-item" role="tab" data-section="market-analytics" aria-selected="false" tabindex="-1">
            <span class="nav-icon">📊</span>
            <span class="nav-label">Аналитика рынка</span>
          </button>
          <button class="nav-item" role="tab" data-section="lots" aria-selected="false" tabindex="-1">
            <span class="nav-icon">📦</span>
            <span class="nav-label">Управление лотами</span>
          </button>
          <button class="nav-item" role="tab" data-section="automation" aria-selected="false" tabindex="-1">
            <span class="nav-icon">🤖</span>
            <span class="nav-label">Автоматизация</span>
          </button>
          <button class="nav-item" role="tab" data-section="chat" aria-selected="false" tabindex="-1">
            <span class="nav-icon">💬</span>
            <span class="nav-label">Чат и сообщения</span>
          </button>
          <button class="nav-item" role="tab" data-section="translation" aria-selected="false" tabindex="-1">
            <span class="nav-icon">🌐</span>
            <span class="nav-label">Перевод</span>
          </button>
          <button class="nav-item" role="tab" data-section="visual" aria-selected="false" tabindex="-1">
            <span class="nav-icon">✨</span>
            <span class="nav-label">Визуальные эффекты</span>
          </button>
          <button class="nav-item" role="tab" data-section="utilities" aria-selected="false" tabindex="-1">
            <span class="nav-icon">🔧</span>
            <span class="nav-label">Утилиты</span>
          </button>
          <button class="nav-item" role="tab" data-section="accounts" aria-selected="false" tabindex="-1">
            <span class="nav-icon">👤</span>
            <span class="nav-label">Аккаунты</span>
          </button>
          <button class="nav-item" role="tab" data-section="about" aria-selected="false" tabindex="-1">
            <span class="nav-icon">ℹ️</span>
            <span class="nav-label">О расширении</span>
          </button>
        </nav>
      </aside>

      <main class="main-content">
        <div id="loading-state" class="loading-overlay hidden">
          <div class="loading-spinner">
            <div class="spinner-inner"></div>
          </div>
          <p>Загрузка настроек...</p>
        </div>

        <div id="sections-container"></div>

        <div class="action-bar">
          <button id="save-all-btn" class="btn btn-primary btn-large">
            <span class="btn-icon">💾</span>
            Сохранить все изменения
          </button>
          <button id="reset-section-btn" class="btn btn-secondary">
            <span class="btn-icon">↺</span>
            Сбросить раздел
          </button>
          <button id="export-btn" class="btn btn-outline">
            <span class="btn-icon">📤</span>
            Экспорт настроек
          </button>
          <button id="import-btn" class="btn btn-outline">
            <span class="btn-icon">📥</span>
            Импорт настроек
          </button>
          <input type="file" id="import-file" accept=".json" style="display: none;">
        </div>
      </main>
    </div>

    <footer class="app-footer">
      <p>© 2024 FunPay Customizer v1.0.0 | Создано @MarkusGarantor | <a href="https://github.com" target="_blank">GitHub</a></p>
    </footer>
  </div>

  <script src="../shared/storage.js"></script>
  <script src="../shared/ui-components.js"></script>
  <script src="options.js"></script>
</body>
</html>
